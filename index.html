<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light" style="color-scheme: light;"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>معشبة مجتمع الناجحين – نواكشوط</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&amp;family=Reem+Kufi:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f8ef;--ink:#17301f;--card:#fff;--mut:#5a6e60;--g:#2c7a49;--g2:#14422b;--gold:#f2b84b;--line:#dbe7d6;--hd:rgba(255,255,255,.86);box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a12;--ink:#eaf3e6;--card:#16271c;--mut:#a3b3a6;--line:#264131;--hd:rgba(14,26,18,.88)}}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Tajawal,Tahoma,sans-serif;line-height:1.75}
button,.btn{font:inherit;cursor:pointer;border:0;border-radius:999px;padding:12px 24px;font-weight:800;text-decoration:none;display:inline-block}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:8px;padding:9px 14px;background:var(--hd);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:8px;flex:1;color:var(--g2);text-decoration:none;min-width:0}
.logo b{font-family:'Reem Kufi',serif;font-size:1.12rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(prefers-color-scheme:dark){.logo{color:#bfe3c6}}
.cartb{background:var(--g);color:#fff;padding:9px 16px}
.ghost{background:transparent;border:1px solid var(--line);color:var(--mut);padding:6px 12px;font-size:.85rem}
.red{background:var(--g);color:#fff}.wa{background:#25d366;color:#06361a}
.hero{position:relative;overflow:hidden;min-height:calc(100svh - 62px);background:linear-gradient(180deg,#26524d 0%,#4f8c7a 38%,#9fcfb4 62%,#d5ebc9 100%);color:#fff}
.sun{position:absolute;top:-12%;left:-15%;width:75vmax;height:75vmax;background:radial-gradient(circle,rgba(255,238,180,.6),rgba(255,238,180,0) 62%)}
.cloud{position:absolute;top:5%;left:-10%;width:70%;height:110px;border-radius:50%;background:rgba(255,255,255,.2);filter:blur(24px);animation:drift 38s ease-in-out infinite alternate}
.cloud.c2{top:16%;left:35%;width:60%;animation-duration:50s}
@keyframes drift{to{transform:translateX(18%)}}
.hills{position:absolute;left:0;right:0;bottom:-1px;width:100%;height:44%;z-index:1}
#rain{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
.pt{position:absolute;top:-20px;left:var(--x);width:12px;height:16px;background:#ffc3d6;border-radius:85% 0 85% 0;z-index:2;opacity:.9;animation:fall var(--d) linear var(--s) infinite}
@keyframes fall{0%{transform:translate(0,0) rotate(0)}50%{transform:translate(40px,55vh) rotate(180deg)}100%{transform:translate(-20px,105vh) rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.pt,.cloud{animation:none}}
.hc{position:relative;z-index:3;max-width:680px;margin:auto;padding:56px 22px 0;text-align:center;text-shadow:0 2px 14px rgba(8,40,30,.45)}
.tag{display:inline-block;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.45);border-radius:999px;padding:4px 16px;font-weight:700;margin-bottom:14px;backdrop-filter:blur(6px)}
.hc h1{font-family:'Reem Kufi',serif;font-size:clamp(2.6rem,10vw,4.6rem);line-height:1.2;margin:0 0 10px}
.hc p{font-size:1.15rem;margin:0 auto 22px;max-width:34ch}
.hc .btn{margin:4px;text-shadow:none}.hc .red{background:var(--gold);color:#3a2800}
section{padding:36px 16px;max-width:1100px;margin:auto}
h2{font-family:'Reem Kufi',serif;font-size:2rem;margin:0 0 10px;color:var(--g2);display:flex;align-items:center;gap:14px}
@media(prefers-color-scheme:dark){h2{color:#bfe3c6}}
h2:after{content:"";flex:1;height:2px;background:repeating-linear-gradient(90deg,var(--gold) 0 10px,transparent 10px 18px)}
.lead{color:var(--mut);margin:0 0 18px;max-width:60ch}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;margin-bottom:10px}
.chip{background:var(--card);border:1px solid var(--line);color:var(--ink);white-space:nowrap;padding:9px 18px}
.chip.on{background:var(--g);color:#fff;border-color:var(--g)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:10px;display:flex;flex-direction:column;box-shadow:0 10px 24px rgba(20,66,43,.09)}
.tile{height:170px;border-radius:120px 120px 18px 18px;display:grid;place-items:center;background:linear-gradient(135deg,var(--c),#14422b)}
.tile.ph{background:radial-gradient(ellipse at 50% 30%,#fff 0,#e3f1df 80%)}
.tile img{max-height:140px;max-width:80%;object-fit:contain;filter:drop-shadow(0 6px 8px rgba(0,0,0,.22))}
.tile i{width:46px;height:70px;border-radius:12px 12px 8px 8px;background:#fff;position:relative}
.tile i:before{content:"";position:absolute;top:-9px;left:10px;width:26px;height:11px;background:#fff;border-radius:4px}
.tile i:after{content:"";position:absolute;top:24px;left:8px;width:30px;height:26px;border-radius:50%;background:#e57a9a}
.card h3{font-size:.98rem;margin:12px 4px 6px;text-align:center;flex:1}
.pr{margin:0 2px 8px}.pr span{display:flex;justify-content:space-between;align-items:center;padding:5px 10px;border-radius:12px;font-size:.9rem}
.pr .m{background:var(--g);color:#fff;font-weight:800}.pr span:not(.m){color:var(--mut)}
.pr em{font-style:normal;font-size:.78rem;opacity:.9}
.card .add{margin:0;border-radius:16px;background:var(--gold);color:#3a2800;padding:10px}
.vg{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.vg figure{margin:0;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:10px}
.vg video{width:100%;aspect-ratio:16/9;border-radius:16px;background:#000;display:block}
.vg figcaption{text-align:center;font-weight:700;padding:8px 0 2px}
.about{display:grid;gap:18px}@media(min-width:760px){.about{grid-template-columns:1fr 1fr}}
.box{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:20px}
