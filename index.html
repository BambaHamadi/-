<!-- بداية الإضافة الخاصة بمعشبة مجتمع الناجحين (DXN) -->
<style>
.dxn-slider{background:var(--card,#fff);border-bottom:1px solid var(--line,#dbe7d6);padding:16px 0;overflow:hidden}
.dxn-slider-hd{text-align:center;font-weight:800;color:var(--g2,#14422b);margin-bottom:10px;font-size:1.05rem}
.dxn-track{display:flex;width:max-content;animation:dxnMove 28s linear infinite}
.dxn-track:hover{animation-play-state:paused}
.dxn-slide{width:150px;margin:0 8px;background:var(--bg,#f4f8ef);border:1px solid var(--line,#dbe7d6);border-radius:20px;padding:8px;text-align:center;flex-shrink:0}
.dxn-slide img{height:95px;max-width:85%;object-fit:contain}
.dxn-slide b{display:block;font-size:.82rem;margin-top:5px;color:var(--ink,#17301f);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@keyframes dxnMove{0%{transform:translateX(0)}100%{transform:translateX(50%)}}

.dxn-checkout-extra{background:var(--bg,#f4f8ef);border:1px solid var(--line,#dbe7d6);border-radius:20px;padding:12px;margin:12px 0;text-align:right}
.dxn-bank-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.dxn-bank-item{background:var(--card,#fff);border:2px solid var(--line,#dbe7d6);border-radius:14px;padding:8px;text-align:center;cursor:pointer;transition:.2s}
.dxn-bank-item.selected{border-color:var(--g,#2c7a49);background:rgba(44,122,73,.09)}
.dxn-bank-item b{display:block;color:var(--g2,#14422b);font-size:.95rem}
.dxn-bank-item span{display:block;font-family:monospace;font-weight:800;color:#c98a18;font-size:1.02rem;margin:2px 0}
.dxn-copy-btn{background:var(--g,#2c7a49);color:#fff;border:0;border-radius:8px;padding:2px 10px;font-size:.75rem;cursor:pointer}

.dxn-cap-label{display:block;border:2px dashed var(--g,#2c7a49);border-radius:16px;padding:12px;text-align:center;cursor:pointer;margin-top:10px;background:var(--card,#fff)}
.dxn-cap-label input{display:none}
#dxnPreviewImg{max-width:100%;max-height:140px;border-radius:10px;margin:8px auto 0;display:none}

.dxn-inv-btn{width:100%;margin-top:10px;background:var(--gold,#f2b84b);color:#3a2800;border:0;border-radius:14px;padding:11px;font-weight:800;cursor:pointer}
.dxn-invoice-card{background:#fff;color:#17301f;border:2px solid var(--g,#2c7a49);border-radius:18px;padding:14px;margin-top:12px;display:none;box-shadow:0 8px 20px rgba(0,0,0,.08)}
.dxn-inv-row{display:flex;justify-content:space-between;font-size:.88rem;margin:4px 0;border-bottom:1px dashed #eee;padding-bottom:3px}
</style>

<script>
(function(){
  let selectedApp = { name: "بنكيلي", num: "22010206" };
  let receiptImageBase64 = "";

  function initDxnUpgrades() {
    // 1. إنشاء شريط الصور المتحرك من منتجات DXN الموجودة في الصفحة دون تعديلها
    const productCards = Array.from(document.querySelectorAll('.card'));
    const heroSection = document.querySelector('.hero');
    if (productCards.length > 0 && heroSection && !document.querySelector('.dxn-slider')) {
      const sliderDiv = document.createElement('div');
      sliderDiv.className = 'dxn-slider';
      const slidesHtml = productCards.map(card => {
        const imgEl = card.querySelector('img');
        const titleEl = card.querySelector('h3');
        if (!imgEl) return '';
        return `<div class="dxn-slide"><img src="${imgEl.src}" alt=""><b>${titleEl ? titleEl.textContent : ''}</b></div>`;
      }).join('');
      sliderDiv.innerHTML = `
        <div class="dxn-slider-hd">✨ منتجات DXN الطبيعية (صور متحركة) ✨</div>
        <div class="dxn-track">${slidesHtml}${slidesHtml}</div>
      `;
      heroSection.insertAdjacentElement('afterend', sliderDiv);
    }

    // 2. البحث عن نافذة "سلة الطلب" لإضافة الدفع البنكي وخانة الكبتير والفاتورة الجاهزة
    const allElements = Array.from(document.querySelectorAll('dialog, .modal, [role="dialog"], div'));
    const cartModal = allElements.find(el => el.textContent.includes('سلة الطلب') && el.textContent.includes('إرسال الطلب عبر واتساب') && el.children.length < 15);
    
    if (cartModal && !document.querySelector('.dxn-checkout-extra')) {
      const waButton = Array.from(cartModal.querySelectorAll('button, a')).find(b => b.textContent.includes('إرسال الطلب عبر واتساب'));
      const extraBox = document.createElement('div');
      extraBox.className = 'dxn-checkout-extra';
      extraBox.innerHTML = `
        <b style="color:var(--g2,#14422b);font-size:.95rem">💳 اختر التطبيق البنكي وحوّل المبلغ:</b>
        <div class="dxn-bank-grid">
          <div class="dxn-bank-item selected" data-b="بنكيلي" data-n="22010206">
            <b>بنكيلي</b><span>22010206</span>
            <button type="button" class="dxn-copy-btn" data-copy="22010206">نسخ الرقم</button>
          </div>
          <div class="dxn-bank-item" data-b="مصرفي" data-n="48436080">
            <b>مصرفي</b><span>48436080</span>
            <button type="button" class="dxn-copy-btn" data-copy="48436080">نسخ الرقم</button>
          </div>
          <div class="dxn-bank-item" data-b="السداد" data-n="48436080">
            <b>السداد</b><span>48436080</span>
            <button type="button" class="dxn-copy-btn" data-copy="48436080">نسخ الرقم</button>
          </div>
          <div class="dxn-bank-item" data-b="بيم بنك" data-n="22010206">
            <b>بيم بنك</b><span>22010206</span>
            <button type="button" class="dxn-copy-btn" data-copy="22010206">نسخ الرقم</button>
          </div>
        </div>

        <label class="dxn-cap-label">
          <b style="font-size:.9rem">📸 ضع هنا صورة التحويل (كبتير من المال المرسل)</b>
          <input type="file" id="dxnReceiptInput" accept="image/*">
          <img id="dxnPreviewImg" alt="معاينة الكبتير">
        </label>

        <button type="button" class="dxn-inv-btn" id="dxnGenerateInvBtn">
          📄 إصدار الفاتورة الجاهزة وتأكيد عملية البيع
        </button>

        <div class="dxn-invoice-card" id="dxnReadyInvoice"></div>
      `;

      if (waButton && waButton.parentNode) {
        waButton.parentNode.insertBefore(extraBox, waButton);
      } else {
        cartModal.appendChild(extraBox);
      }

      // أحداث اختيار البنك ونسخ الرقم
      extraBox.querySelectorAll('.dxn-bank-item').forEach(item => {
        item.addEventListener('click', () => {
          extraBox.querySelectorAll('.dxn-bank-item').forEach(i => i.classList.remove('selected'));
          item.classList.add('selected');
          selectedApp = { name: item.dataset.b, num: item.dataset.n };
        });
      });

      extraBox.querySelectorAll('.dxn-copy-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          navigator.clipboard.writeText(btn.dataset.copy);
          btn.textContent = 'تم النسخ ✓';
          setTimeout(() => btn.textContent = 'نسخ الرقم', 1500);
        });
      });

      // معاينة صورة الكبتير
      document.getElementById('dxnReceiptInput').addEventListener('change', (e) => {
        const file = e.target.files;
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          receiptImageBase64 = ev.target.result;
          const img = document.getElementById('dxnPreviewImg');
          img.src = receiptImageBase64;
          img.style.display = 'block';
        };
        reader.readAsDataURL(file);
      });

      // إصدار الفاتورة الجاهزة
      document.getElementById('dxnGenerateInvBtn').addEventListener('click', () => {
        if (!receiptImageBase64) {
          alert('يرجى وضع صورة التحويل (كبتير من المال المرسل) أولاً لإصدار الفاتورة.');
          return;
        }
        const invNum = 'DXN-' + Math.floor(100000 + Math.random() * 900000);
        const dateStr = new Date().toLocaleDateString('ar-MR');
        
        // قراءة المجموع ونوع السعر من السلة الحالية تلقائياً
        const totalMatch = cartModal.textContent.match(/المجموع:[^\n]+/);
        const totalText = totalMatch ? totalMatch : 'حسب السلة';
        const priceType = cartModal.querySelector('.on, .active, [aria-pressed="true"]')?.textContent?.trim() || 'محدد في السلة';

        const invCard = document.getElementById('dxnReadyInvoice');
        invCard.style.display = 'block';
        invCard.innerHTML = `
          <div style="text-align:center;border-bottom:2px dashed #dbe7d6;padding-bottom:8px;margin-bottom:8px">
            <b style="color:#14422b;font-size:1.05rem">🌿 معشبة مجتمع الناجحين – نواكشوط</b><br>
            <small>فاتورة بيع إلكترونية جاهزة</small><br>
            <b>رقم الفاتورة: ${invNum}</b> | <small>${dateStr}</small>
          </div>
          <div class="dxn-inv-row"><span>فئة السعر:</span><b>${priceType}</b></div>
          <div class="dxn-inv-row"><span>التطبيق البنكي:</span><b>${selectedApp.name} (${selectedApp.num})</b></div>
          <div class="dxn-inv-row"><span>قيمة الطلب:</span><b>${totalText}</b></div>
          <div style="text-align:center;margin-top:8px">
            <small style="color:#2c7a49;font-weight:700;display:block;margin-bottom:4px">✅ صورة التحويل (الكبتير) المرفقة:</small>
            <img src="${receiptImageBase64}" style="max-height:130px;border-radius:10px;border:1px solid #ccc">
          </div>
          <p style="font-size:.8rem;color:#5a6e60;text-align:center;margin:8px 0 0">
            اضغط الآن على زر <b>"إرسال الطلب عبر واتساب"</b> بالأسفل وأرفق صورة التحويل في المحادثة.
          </p>
        `;
      });
    }
  }

  // تشغيل التحديثات عند تحميل الصفحة وعند فتح السلة
  window.addEventListener('load', initDxnUpgrades);
  setTimeout(initDxnUpgrades, 1000);
})();
</script>
<!-- نهاية الإضافة -->
